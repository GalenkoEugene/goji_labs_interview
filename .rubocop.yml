# RuboCop configuration for Rails project
require:
  - rubocop-rails
  - rubocop-rspec

# Omakase Ruby styling for Rails  
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - 'db/schema.rb'
    - 'db/migrate/*'
    - 'bin/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'log/**/*'
    - 'public/**/*'
    - 'storage/**/*'
    - 'config/boot.rb'

# Rails specific configurations
Rails:
  Enabled: true

# Allow longer line length for Rails projects
Layout/LineLength:
  Max: 120

# Allow longer block length for Rails DSL and specs
Metrics/BlockLength:
  Max: 30
  Exclude:
    - 'spec/**/*'
    - 'config/routes.rb'
    - 'config/environments/*'
    - 'db/migrate/*'
    - 'Rakefile'

# RSpec specific configurations
RSpec/MultipleExpectations:
  Max: 5

RSpec/ExampleLength:
  Max: 20

# Allow describe class usage in RSpec
RSpec/DescribeClass:
  Exclude:
    - 'spec/requests/**/*'
    - 'spec/integration/**/*'

# Documentation requirements
Style/Documentation:
  Enabled: false
